name: F-Droid repo

# Publish a self-hosted F-Droid repository to GitHub Pages (Threema-style) by
# REUSING an already-built Android APK instead of rebuilding it here. The APK is
# pulled from the most recent successful "Android build" run (android.yml), so
# this job does no Rust/NDK/Tauri compilation — it only signs, indexes, and
# deploys. That keeps CI minutes/credits low.
#
# The repository accumulates every version it publishes (older APKs are restored
# from the live repo and re-indexed), so F-Droid users can update AND downgrade.
#
# The repo URL is derived from whichever repo runs this workflow (its GitHub
# Pages project site), so it works unmodified on upstream and on any fork. Users
# add
#   https://<owner>.github.io/<repo>/fdroid/repo/?fingerprint=<FP>
# to their F-Droid client and get installs + auto-updates. Override the URL with
# an Actions variable FDROID_REPO_URL if publishing under a custom domain.
#
# Requires three repo secrets (set them once — see packaging/fdroid/SELFHOSTED.md):
#   FDROID_KEYSTORE_B64   base64 of the PKCS12 keystore
#   FDROID_KEYSTORE_PASS  keystore password
#   FDROID_KEY_ALIAS      key alias (materix)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Android build run id to reuse the APK from (blank = latest successful)"
        required: false
        default: ""
      reset_repo:
        description: "Start the repo fresh (skip restoring old APKs) — purges pre-existing versions"
        required: false
        default: "false"
  release:
    types: [published]

permissions:
  contents: read
  actions: read      # read + download artifacts from the Android build run
  pages: write
  id-token: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  publish:
    name: Publish F-Droid repo (reuse prebuilt APK)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Workflow file + artifact name produced by the Android build.
      ANDROID_WORKFLOW: android.yml
      APK_ARTIFACT: materix-android-apk
    steps:
      - uses: actions/checkout@v4

      - name: Resolve F-Droid repo URL (works on any fork)
        env:
          # Optional override: set an Actions variable FDROID_REPO_URL (repo or
          # org level) to publish under a custom domain / path. Left unset, the
          # URL is derived from this very repo's GitHub Pages project site, so
          # the workflow works unmodified on upstream and on any fork.
          OVERRIDE_URL: ${{ vars.FDROID_REPO_URL }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE_URL" ]; then
            URL="$OVERRIDE_URL"
          else
            # Pages hostnames are lowercase; the project path keeps the repo
            # name's case (e.g. https://datanoisetv.github.io/Materix/...).
            OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            NAME="${GITHUB_REPOSITORY#*/}"
            URL="https://${OWNER}.github.io/${NAME}/fdroid/repo"
          fi
          URL="${URL%/}"
          echo "REPO_URL=$URL" >> "$GITHUB_ENV"
          echo "F-Droid repo URL: $URL"

      # apksigner + fdroidserver need a JDK. No Node/Rust/NDK/Tauri toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android build run to reuse
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RID="${{ inputs.run_id }}"
          if [ -z "$RID" ]; then
            # Default to the latest successful Android build (this branch first,
            # then repo-wide) so we always ship the most recently built APK.
            RID=$(gh run list --workflow "$ANDROID_WORKFLOW" --status success \
                    --branch "${{ github.ref_name }}" --limit 1 \
                    --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -z "$RID" ]; then
              RID=$(gh run list --workflow "$ANDROID_WORKFLOW" --status success \
                      --limit 1 --json databaseId --jq '.[0].databaseId')
            fi
          fi
          if [ -z "$RID" ]; then
            echo "::error::No successful '$ANDROID_WORKFLOW' run found. Run the Android build first."
            exit 1
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Reusing prebuilt APK from Android build run $RID"

      - name: Download the prebuilt APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: prebuilt

      - name: Guard — reused artifact must contain BOTH modern and -compat APKs
        # WHY THIS GUARD EXISTS: a past bad deploy shipped 0.2.0 built from a
        # feature branch whose android.yml had dropped the `-compat` versionName
        # suffix — the compat APK carried the same semver as the modern one, so
        # the old device's F-Droid showed "0.2.0" with no -compat label and no
        # guard stopped a modern-only / mislabeled artifact from being published.
        # This is the "both-or-nothing" PUBLISH gate: refuse to sign, index, or
        # deploy unless the reused artifact contains a properly-labeled compat
        # APK (versionName ending in -compat, maxSdkVersion=30) ALONGSIDE a
        # non-compat modern APK. Runs before any restore/sign work so it fails
        # fast. android.yml has its own build-time guard; this one additionally
        # protects publishes that reuse an artifact from any (older) build.
        run: |
          set -euo pipefail
          # Newest installed build-tools (ANDROID_HOME is preinstalled on the
          # ubuntu runner — same lookup the sign step below already uses).
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT="$BT/aapt"
          test -x "$AAPT" || { echo "::error::aapt not found under $BT"; exit 1; }
          mapfile -t APKS < <(find prebuilt -name '*.apk' | sort)
          [ "${#APKS[@]}" -gt 0 ] || { echo "::error::No APK in the reused artifact"; exit 1; }
          modern_count=0; compat_count=0; compat_max_ok=0
          for APK in "${APKS[@]}"; do
            # versionName='...'; maxSdkVersion:'NN' only present when declared.
            VN="$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
            MAX="$("$AAPT" dump badging "$APK" | sed -n "s/^maxSdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)"
            [ -n "$VN" ] || { echo "::error::Could not read versionName from $APK"; exit 1; }
            echo "artifact APK: $(basename "$APK") versionName=$VN maxSdk=${MAX:-<none>}"
            case "$VN" in
              *-compat) compat_count=$((compat_count+1)); [ "$MAX" = "30" ] && compat_max_ok=$((compat_max_ok+1)) || true ;;
              *)        modern_count=$((modern_count+1)) ;;
            esac
          done
          [ "$modern_count" -ge 1 ] || { echo "::error::No modern APK (versionName without -compat) in artifact — refusing to publish a compat-only build"; exit 1; }
          [ "$compat_count" -ge 1 ] || { echo "::error::No -compat APK in artifact — refusing to publish a modern-only/mislabeled build (see the 0.2.0 mislabel incident)"; exit 1; }
          [ "$compat_max_ok" -ge 1 ] || { echo "::error::-compat APK does not declare maxSdkVersion=30 — F-Droid would offer it to modern devices; refusing to publish"; exit 1; }
          echo "Publish guard passed: $modern_count modern + $compat_count compat APK(s); compat maxSdkVersion=30 verified."

      - name: Restore already-published versions (enables downgrade)
        if: ${{ inputs.reset_repo != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p fdroidrepo/repo
          BASE="${REPO_URL%/}"
          # Pull every APK already served by the live repo so the index we build
          # below contains the full version history — F-Droid can then offer
          # older versions for downgrade, not just the newest one.
          if curl -fsSL "$BASE/index-v2.json" -o /tmp/idx.json 2>/dev/null; then
            jq -r '.packages[].versions[].file.name' /tmp/idx.json \
              | sed 's#^/##' | sort -u | while read -r f; do
              case "$f" in
                *.apk)
                  if curl -fsSL "$BASE/$f" -o "fdroidrepo/repo/$f"; then
                    echo "restored $f"
                  else
                    echo "war: could not restore $f (skipping)"
                  fi
                  ;;
              esac
            done
          else
            echo "No existing repo index found (first publish) — starting fresh."
          fi

      - name: Sign the prebuilt APK(s)
        env:
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "${{ secrets.FDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/materix.p12"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT="$BT/aapt"
          mkdir -p fdroidrepo/repo
          # The Android build uploads one OR MORE APKs (a "modern" variant and,
          # for old System WebViews, a "-compat" variant). Both now carry the same
          # semver versionName (F-Droid shows e.g. "0.2.0" whichever a device
          # gets), so the filename is keyed by versionCode to keep every build
          # distinct and never overwritten — F-Droid still lists, downgrades, and
          # picks per device by versionCode + maxSdk.
          mapfile -t APKS < <(find prebuilt -name '*.apk' | sort)
          [ "${#APKS[@]}" -gt 0 ] || { echo "::error::No APK in the reused artifact"; exit 1; }
          echo "Found ${#APKS[@]} APK(s) to sign: ${APKS[*]}"
          for UNSIGNED in "${APKS[@]}"; do
            VN="$("$AAPT" dump badging "$UNSIGNED" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
            VC="$("$AAPT" dump badging "$UNSIGNED" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
            if [ -z "$VC" ] || [ -z "$VN" ]; then echo "::error::Could not read version from $UNSIGNED"; exit 1; fi
            OUT="fdroidrepo/repo/materix_${VN}_${VC}.apk"
            "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/materix.p12" --ks-type PKCS12 \
              --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_PASS" \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$OUT" >/dev/null
            echo "Signed $OUT (versionName=$VN versionCode=$VC)"
          done

      - name: Build the F-Droid index
        env:
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet fdroidserver
          cd fdroidrepo
          cat > config.yml <<EOF
          repo_url: ${REPO_URL}
          repo_name: Materix
          repo_description: >-
            Self-hosted F-Droid repository for Materix, a multi-account Matrix
            client with end-to-end encryption.
          # 0 = keep every version in the main repo (no archiving) so users can
          # install or downgrade to any previously published version.
          archive_older: 0
          keystore: $RUNNER_TEMP/materix.p12
          repo_keyalias: ${KS_ALIAS}
          keystorepass: ${KS_PASS}
          keypass: ${KS_PASS}
          keydname: "CN=Materix, O=The Materix Authors"
          EOF
          chmod 600 config.yml
          # App listing metadata (fdroidserver YAML format, not AppStream XML).
          mkdir -p metadata
          cat > metadata/org.materix.app.yml <<'EOF'
          Categories:
            - Internet
          License: Apache-2.0
          AuthorName: The Materix Authors
          WebSite: ${{ github.server_url }}/${{ github.repository }}
          SourceCode: ${{ github.server_url }}/${{ github.repository }}
          IssueTracker: ${{ github.server_url }}/${{ github.repository }}/issues
          Summary: Multi-account Matrix messenger with end-to-end encryption
          Description: |-
            Materix is a multi-account Matrix client that feels like a mainstream
            messenger while staying a full Matrix client. End-to-end encryption is
            on by default for direct messages and new private rooms.
          EOF
          # Indexes every APK now present in repo/ (restored history + new one).
          fdroid update --create-metadata --verbose --pretty

      - name: Assemble the Pages site
        env:
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p _site/fdroid
          cp -r fdroidrepo/repo _site/fdroid/repo

          # Repo signing-cert fingerprint (SHA-256 of the cert DER) — the value
          # F-Droid pins the repo to. Derive it from the keystore so the landing
          # page always advertises the correct URL + fingerprint for this repo.
          echo "${{ secrets.FDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/materix.p12"
          FP="$(keytool -exportcert -keystore "$RUNNER_TEMP/materix.p12" -storetype PKCS12 \
                  -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null \
                | openssl dgst -sha256 | awk '{print $NF}')"
          if [ -z "$FP" ]; then echo "::error::Could not compute repo fingerprint"; exit 1; fi
          FP_SPACED="$(printf '%s' "$FP" | tr 'a-z' 'A-Z' | sed 's/..../& /g; s/ *$//')"
          REPO_NOPROTO="${REPO_URL#https://}"

          # Fill the templated landing page with this repo's real values.
          sed -e "s#__REPO_URL__#${REPO_URL}#g" \
              -e "s#__REPO_NOPROTO__#${REPO_NOPROTO}#g" \
              -e "s#__FP_SPACED__#${FP_SPACED}#g" \
              -e "s#__FP__#${FP}#g" \
              -e "s#__SOURCE_URL__#${SOURCE_URL}#g" \
              -e "s#__SOURCE_LABEL__#${SOURCE_URL#https://}#g" \
              packaging/fdroid/landing.html > _site/index.html
          echo "Landing page advertises: ${REPO_URL}/?fingerprint=${FP}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
